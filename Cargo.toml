[package]
name = "grounding-coder"
version = "0.1.0"
edition = "2024"
description = "A deterministic, non-guessing coding agent. LLM is unverified NL→intent only."

[lib]
name = "grounding_coder"
path = "src/lib.rs"

[[bin]]
name = "gc"
path = "src/bin/gc.rs"

[[bin]]
name = "gcui"
path = "src/bin/gcui.rs"
required-features = ["ui"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["json", "rustls"] }
anyhow = "1.0"
parking_lot = "0.12"
dirs = "5"
walkdir = "2"
regex = "1"
once_cell = { version = "1", features = ["parking_lot"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"

# dioxus UI (for mobile/desktop) — only compiled with "ui" feature
dioxus = { version = "0.7", features = ["mobile", "asset"], optional = true }

[features]
default = ["cli"]
cli = []
ui = ["dep:dioxus"]

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
android-activity = { version = "0.6", features = ["native-activity"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = "debuginfo"
