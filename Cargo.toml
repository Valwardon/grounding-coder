[package]
name = "grounding-coder"
version = "0.2.0"
edition = "2024"
description = "A deterministic, non-guessing coding agent for Android. LLM is unverified NL→intent only; all code generation is driven by a deterministic engine."

[lib]
name = "grounding_coder"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "gc"
path = "src/bin/gc.rs"
required-features = ["cli"]

[[bin]]
name = "android_main"
path = "src/android_main.rs"
required-features = ["ui"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
# HTTPS without any platform trust store (reqwest's default TLS aborts on
# Android via rustls-platform-verifier JNI init). hyper + Mozilla roots.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", features = ["http1", "webpki-roots", "aws-lc-rs", "native-tokio"] }
http-body-util = "0.1"
bytes = "1"
base64 = "0.22"
# Parse-level oracle for hosts without cargo (Android): real syntax facts,
# honestly labeled — never a substitute claim for type/test verification.
syn = { version = "2", features = ["full", "parsing"] }
# JNI bridge for the app-private files dir (Android file access).
# Without it the engine runs against an unreadable CWD and every
# file op dies with "No such file or directory".
jni = "0.21"
anyhow = "1.0"
parking_lot = "0.12"
dirs = "5"
walkdir = "2"
regex = "1"
once_cell = { version = "1", features = ["parking_lot"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"

# dioxus UI — only compiled with "ui" feature (Android/iOS mobile targets)
dioxus = { version = "0.7", features = ["mobile"], optional = true }

[features]
default = ["cli"]
cli = []
ui = ["dep:dioxus"]

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = "debuginfo"
