[application]
name = "grounding-coder"
identifier = "com.grounding.coder"

[android]
package = "com.grounding.coder"
version_name = "0.2.0"
version_code = 1
min_sdk_version = 24
target_sdk_version = 34

[android.permissions]
INTERNET = { description = "Required for OpenRouter API calls" }
ACCESS_NETWORK_STATE = { description = "Required to detect network connectivity" }
VIBRATE = { description = "Required for vibration feedback" }

[web]
base_path = "/grounding-coder"
